[package]
name = "image-compressor"
version = "0.1.0"
edition = "2021"
description = "Discord画像圧縮くん - Rust/WASM画像圧縮エンジン"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
image = { version = "0.25", features = ["jpeg", "png", "webp", "bmp", "gif"] }
web-sys = { version = "0.3", features = ["console"] }
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
